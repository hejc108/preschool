<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGradLm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bgGradLm)"/>
  <!-- Plate Shadow -->
  <ellipse cx="60" cy="68" rx="46" ry="34" fill="#059669" opacity="0.15"/>
  <!-- Plate Outer -->
  <ellipse cx="60" cy="62" rx="46" ry="34" fill="url(#plateGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Plate Inner -->
  <ellipse cx="60" cy="62" rx="36" ry="25" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Rice Mound -->
  <ellipse cx="45" cy="58" rx="18" ry="14" fill="#FFFFFF"/>
  <ellipse cx="45" cy="55" rx="14" ry="10" fill="#F1F5F9"/>
  <!-- Meat / Savory Dish (e.g. golden chicken / braised pork) -->
  <ellipse cx="74" cy="58" rx="15" ry="11" fill="#D97706"/>
  <ellipse cx="76" cy="57" rx="12" ry="8" fill="#B45309"/>
  <ellipse cx="70" cy="64" rx="10" ry="7" fill="#F59E0B"/>
  <!-- Veggies (Broccoli / Cucumber) -->
  <circle cx="56" cy="70" r="6" fill="#10B981"/>
  <circle cx="62" cy="71" r="5" fill="#059669"/>
  <circle cx="48" cy="68" r="4" fill="#34D399"/>
  <!-- Tomato Slice -->
  <circle cx="78" cy="68" r="5" fill="#EF4444"/>
  <circle cx="78" cy="68" r="3" fill="#DC2626"/>
  <!-- Fork & Spoon Accent -->
  <path d="M14 38 L14 82" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M10 44 L18 44" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M106 38 L106 82" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="106" cy="44" rx="4" ry="6" fill="#94A3B8"/>
</svg>
