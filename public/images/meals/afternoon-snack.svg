<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGradSnk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="100%" stop-color="#FED7AA"/>
    </linearGradient>
    <linearGradient id="milkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bgGradSnk)"/>
  <!-- Glass of Nut Milk / Yogurt -->
  <g transform="translate(18, 12)">
    <path d="M12 28 L16 80 Q16 84 26 84 Q36 84 36 80 L40 28 Z" fill="url(#milkGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Glass Rim -->
    <ellipse cx="26" cy="28" rx="14" ry="4" fill="#E2E8F0"/>
    <!-- Milk Level -->
    <ellipse cx="26" cy="38" rx="13" ry="3.5" fill="#FFFFFF"/>
    <!-- Straw -->
    <path d="M28 14 L36 46" stroke="#FB7185" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Cookie / Flan / Snack Pastry -->
  <g transform="translate(56, 44)">
    <!-- Cookie Shadow -->
    <ellipse cx="28" cy="46" rx="22" ry="8" fill="#EA580C" opacity="0.15"/>
    <!-- Cookie Body -->
    <circle cx="28" cy="32" r="20" fill="#D97706"/>
    <circle cx="28" cy="32" r="18" fill="#F59E0B"/>
    <!-- Choco Chips -->
    <circle cx="22" cy="24" r="2.5" fill="#78350F"/>
    <circle cx="34" cy="26" r="2.5" fill="#78350F"/>
    <circle cx="28" cy="34" r="2.5" fill="#78350F"/>
    <circle cx="20" cy="36" r="2" fill="#78350F"/>
    <circle cx="36" cy="38" r="2" fill="#78350F"/>
  </g>
</svg>
